name: Beacon CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/detect_test.php
